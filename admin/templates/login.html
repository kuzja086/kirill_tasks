<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в админку</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; margin: 0; color: #1c1e21; }
    form { max-width: 320px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    input, button { padding: 8px 10px; font-size: 15px; }
    button { background: #2b3a55; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .error { color: #b02a37; margin: 0; }
  </style>
</head>
<body>
<form method="post" action="/login">
  <h1>Админка навыка</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Пароль" autofocus required>
  <button type="submit">Войти</button>
</form>
</body>
</html>
